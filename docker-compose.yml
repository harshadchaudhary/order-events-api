name: order-events

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: order-events-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft cluster: this one broker is also the controller,
      # so there is no ZooKeeper to run.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # Containers reach the broker on kafka:19092; the host reaches it on
      # localhost:9092. Both names must be advertised or one side cannot connect.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: order-events-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-events-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: Developer
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/OrderEvents.Api/Dockerfile
    container_name: order-events-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: SqlServer
      Database__ConnectionString: "Server=sqlserver,1433;Database=OrderEvents;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:19092
      Redis__Enabled: "true"
      Redis__ConnectionString: redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/OrderEvents.Worker/Dockerfile
    container_name: order-events-worker
    environment:
      DOTNET_ENVIRONMENT: Production
      Database__Provider: SqlServer
      Database__ConnectionString: "Server=sqlserver,1433;Database=OrderEvents;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:19092
      Kafka__ConsumerGroupId: order-events-worker
      Redis__Enabled: "true"
      Redis__ConnectionString: redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
